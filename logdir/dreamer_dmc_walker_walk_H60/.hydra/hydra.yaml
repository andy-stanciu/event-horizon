hydra:
  run:
    dir: /homes/iws/andys22/579/event-horizon/logdir/dreamer_dmc_walker_walk_H60_seed0
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/homes/iws/andys22/579/event-horizon/logdir/dreamer_dmc_walker_walk_H60_seed0
    - hydra.mode=RUN
    task:
    - logdir=/homes/iws/andys22/579/event-horizon/logdir/dreamer_dmc_walker_walk_H60_seed0
    - model.rep_loss=dreamer
    - env=dmc_proprio
    - env.task=dmc_walker_walk
    - env.steps=200000
    - seed=0
    - batch_length=60
  job:
    name: train
    chdir: null
    override_dirname: batch_length=60,env.steps=200000,env.task=dmc_walker_walk,env=dmc_proprio,logdir=/homes/iws/andys22/579/event-horizon/logdir/dreamer_dmc_walker_walk_H60_seed0,model.rep_loss=dreamer,seed=0
    id: ???
    num: ???
    config_name: configs
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /homes/iws/andys22/579/event-horizon/r2dreamer
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /homes/iws/andys22/579/event-horizon/r2dreamer/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /homes/iws/andys22/579/event-horizon/logdir/dreamer_dmc_walker_walk_H60_seed0
    choices:
      model: size12M
      env: dmc_proprio
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
